name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  # ---- 1. Lint + typecheck ----
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

  # ---- 2. Unit tests ----
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Run unit tests
        run: pnpm test

      - name: Run coverage
        run: pnpm test:cov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

  # ---- 3. Integration tests (real postgres:16) ----
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bbvn
          POSTGRES_PASSWORD: bbvn_dev_password
          POSTGRES_DB: bbvn_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bbvn:bbvn_dev_password@localhost:5432/bbvn_dev
      SHADOW_DATABASE_URL: postgresql://bbvn:bbvn_dev_password@localhost:5432/bbvn_shadow
      # Production defaults to max:1 (one request per Vercel invocation; Neon's
      # pooler handles cross-invocation concurrency). The concurrency int tests
      # (SKIP LOCKED, advisory-lock, concurrent dispatchers) need >1 real pool
      # connection in a single process to exercise the locking, so raise it here.
      DATABASE_POOL_MAX: '5'
      # Test-only secret (64 hex) — required by lib/config/env.ts (no default).
      HOLD_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # Refund/payment PSP is a stub until go-live (#094); without this the refund
      # rail throws PspRefundNotImplementedError. The Issue-051 refundOut integration
      # test (via cancelTrip) needs the stub. The e2e job already sets this.
      PAYMENTS_STUB: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Create shadow database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE bbvn_shadow;" || true
        env:
          PGPASSWORD: bbvn_dev_password

      - name: Ensure Postgres extensions
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS unaccent; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
        env:
          PGPASSWORD: bbvn_dev_password

      - name: Run migrations
        run: pnpm prisma migrate deploy

      # SEC-DB-LEASTPRIV (#558) — regression-guard for the least-privilege split.
      # Apply the SAME script prod uses (scripts/db/least-privilege-role.sql) to the CI
      # database, then assert app_runtime has row DML but NO DDL (TRUNCATE / CREATE-on-schema).
      # A red here means someone weakened the runtime role's privilege ceiling.
      - name: Assert DB privilege split (#558)
        env:
          PGPASSWORD: bbvn_dev_password
        run: |
          sed 's/<YOUR_DATABASE>/bbvn_dev/g' scripts/db/least-privilege-role.sql \
            | psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f -
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT has_table_privilege('app_runtime','"Booking"','DELETE')
               THEN RAISE EXCEPTION 'app_runtime is missing DELETE on Booking'; END IF;
            IF has_table_privilege('app_runtime','"Booking"','TRUNCATE')
               THEN RAISE EXCEPTION 'app_runtime HAS TRUNCATE (DDL leak)'; END IF;
            IF has_schema_privilege('app_runtime','public','CREATE')
               THEN RAISE EXCEPTION 'app_runtime HAS CREATE on schema public'; END IF;
            RAISE NOTICE 'DB privilege split OK';
          END $$;
          SQL

      - name: Seed database
        run: pnpm prisma db seed

      - name: Run integration tests
        run: pnpm vitest:int

  # ---- 4. E2E tests (Playwright, mobile-390) ----
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # #539: the mobile-390 (WebKit) shard intermittently HANGS — next dev/Turbopack (Next
    # 16.2.11) serves chunks on-demand with no chunk-retry, so a slow WebKit hits ChunkLoadError,
    # never hydrates, and all 116 tests time out. With no job timeout that ran to the 360-min
    # default. Fail fast instead (a full green run is ~5-6 min/shard; 25 leaves ample headroom).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-390]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bbvn
          POSTGRES_PASSWORD: bbvn_dev_password
          POSTGRES_DB: bbvn_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bbvn:bbvn_dev_password@localhost:5432/bbvn_dev
      PLAYWRIGHT_BASE_URL: http://localhost:3001
      # See integration-tests: prod defaults to max:1; the app under e2e serves
      # concurrent requests from one Node process, so raise the pool here.
      DATABASE_POOL_MAX: '5'
      # Test-only secret (64 hex) — required by lib/config/env.ts (no default).
      HOLD_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # Route online payments through the local stub gateway for e2e.
      PAYMENTS_STUB: 'true'
      # #473: run the customer auth E2E (login-lockout + otp-roundtrip), previously skipped because
      # E2E_AUTH_ENABLED was never set. The playwright webServer runs `pnpm dev` (NODE_ENV=development),
      # so the OTP peek route's dual-guard (NODE_ENV!=production AND OTP_PEEK_ENABLED) opens and the OTP
      # lands in the peek sink (NOTIFY_STUB stubs email). Only the 2 AUTH specs are enabled here — the
      # E2E_ACCOUNT_ENABLED specs stay gated because all registrations share the localhost IP and
      # customerRegisterRatelimit is 5/15min, so running every auth+account spec together trips the cap.
      E2E_AUTH_ENABLED: 'true'
      OTP_PEEK_ENABLED: 'true'
      NOTIFY_STUB: 'true'
      # pnpm build sets NODE_ENV=production; env.ts superRefine requires these.
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-0123456789ab
      JWT_OPERATOR_SECRET: ci-test-operator-secret-not-for-production-0123
      JWT_ADMIN_SECRET: ci-test-admin-secret-not-for-production-01234567
      TOTP_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      CRON_SECRET: ci-test-cron-secret-00
      REFRESH_TOKEN_SECRET_CUSTOMER: ci-test-refresh-customer-not-for-prod-0123
      REFRESH_TOKEN_SECRET_OPERATOR: ci-test-refresh-operator-not-for-prod-0123
      REFRESH_TOKEN_SECRET_ADMIN: ci-test-refresh-admin-not-for-prod-01234567
      BANK_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      TICKET_SECRET: ci-test-ticket-secret-not-for-prod

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Ensure Postgres extensions
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS unaccent; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
        env:
          PGPASSWORD: bbvn_dev_password

      - name: Run migrations
        run: pnpm prisma migrate deploy

      - name: Seed database
        run: pnpm prisma db seed

      - name: Install Playwright browsers
        # mobile-390 uses devices['iPhone SE'] → WebKit; chromium keeps the desktop project covered.
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build Next.js app
        run: pnpm build

      - name: Run E2E tests
        run: pnpm exec playwright test --project=${{ matrix.project }}
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---- 4b. Quarantine lane (non-blocking) ----
  flaky-e2e:
    name: Flaky E2E Quarantine
    runs-on: ubuntu-latest
    continue-on-error: true
    # #539: same hang guard as e2e-tests (this quarantine lane runs @flaky specs on the same
    # next dev/Turbopack webServer). Shorter cap — it is non-blocking (continue-on-error).
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bbvn
          POSTGRES_PASSWORD: bbvn_dev_password
          POSTGRES_DB: bbvn_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bbvn:bbvn_dev_password@localhost:5432/bbvn_dev
      PLAYWRIGHT_BASE_URL: http://localhost:3001
      DATABASE_POOL_MAX: '5'
      HOLD_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PAYMENTS_STUB: 'true'
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-0123456789ab
      JWT_OPERATOR_SECRET: ci-test-operator-secret-not-for-production-0123
      JWT_ADMIN_SECRET: ci-test-admin-secret-not-for-production-01234567
      TOTP_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      CRON_SECRET: ci-test-cron-secret-00
      REFRESH_TOKEN_SECRET_CUSTOMER: ci-test-refresh-customer-not-for-prod-0123
      REFRESH_TOKEN_SECRET_OPERATOR: ci-test-refresh-operator-not-for-prod-0123
      REFRESH_TOKEN_SECRET_ADMIN: ci-test-refresh-admin-not-for-prod-01234567
      BANK_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      TICKET_SECRET: ci-test-ticket-secret-not-for-prod

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Ensure Postgres extensions
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS unaccent; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
        env:
          PGPASSWORD: bbvn_dev_password

      - name: Run migrations
        run: pnpm prisma migrate deploy

      - name: Seed database
        run: pnpm prisma db seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build Next.js app
        run: pnpm build

      - name: Run flaky E2E quarantine lane
        run: pnpm exec playwright test --grep @flaky --project=chromium --pass-with-no-tests
        env:
          CI: true

  # ---- 5. Data leak audit (static grep) ----
  data-leak-audit:
    name: Data Leak Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run data-leak grep audit
        run: bash scripts/audit/data-leak-grep.sh

  # ---- 6. Dependency audit ----
  dep-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        # SEC-CI-GATE (#567): fail on `high` (was `critical`), and do NOT mask a registry
        # outage as success on the blocking run (dropped --ignore-registry-errors).
        run: pnpm audit --prod --audit-level=high

  # ---- 7. Greppable invariants (KG-14) ----
  greppable-invariants:
    name: Greppable Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run greppable invariants G1-G6
        run: bash scripts/audit/greppable-invariants.sh

  # ---- 8. Secret scanning (gitleaks) ----
  gitleaks:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action@v2 reads PR commits on pull_request events — needs PR read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        # v2 has no `args` input (it warned "Unexpected input(s) 'args'"); it
        # auto-detects the repo .gitleaks.toml. Point at it explicitly via env.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---- 9. Python syntax (no other job looks at a .py file) ----
  # NB (SEC-CI-GATE #567): `master` IS branch-protected (repo is public). A merge is
  # gated on these 8 required status checks passing: Lint & Typecheck, Unit Tests,
  # Integration Tests, E2E Tests (Playwright) (chromium), Data Leak Audit, Dependency
  # Audit, Greppable Invariants, Secret Scanning (gitleaks). NON-required (run but
  # don't block): E2E mobile-390 (known transformAlgorithm WebServer-crash flake),
  # Flaky E2E Quarantine (continue-on-error), and this Python job. PR reviews are NOT
  # required (solo squash-merge on green CI); enforce_admins is off (admins can
  # override); strict/up-to-date is off. NOTE: free-plan protection only enforces
  # while the repo stays PUBLIC — a toggle back to private silently drops the gate.
  python-syntax:
    name: Python Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # No pip install: the checker uses only the stdlib `ast` module, so this
      # job stays as cheap as the grep-based audits above it.
      - name: Parse every .py file
        run: python scripts/audit/python-syntax.py

      # `ast.parse` proves a file is syntactically valid and nothing more. The
      # ranking module is the one piece of tourism logic with real assertions
      # behind it — 15 of them, pure arithmetic, no network and no API quota —
      # and until now nothing ran them, so they were documentation rather than a
      # test. Same job because it needs the same Python and no dependencies.
      - name: Ranking unit tests (tourism-kb/code/xep_hang.py)
        run: python tourism-kb/code/test_xep_hang.py
        env:
          PYTHONIOENCODING: utf-8

      # The output-path guard decides where the tourism pipeline may write, and
      # everything it blocks carries real phone numbers. It must be exercised in
      # BOTH directions — a guard that rejects everything passes a rejection-only
      # test. Runs from the repo root because the guard resolves relative paths
      # against cwd, exactly as open() does.
      - name: Output-path guard tests (tourism-kb/code/duong_dan_ra.py)
        run: python tourism-kb/code/test_duong_dan_ra.py
        env:
          PYTHONIOENCODING: utf-8
