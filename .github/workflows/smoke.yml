name: Post-deploy Smoke (alert-only)

# ALERT-ONLY, KHÔNG chặn promote. Vercel (git-integration) đẩy `deployment_status` khi deploy xong;
# workflow này chạy smoke:prod trên đúng URL Vercel cấp và MỞ/CẬP NHẬT 1 GitHub issue nếu hỏng.
# Không nằm trong required checks của master (workflow riêng) + smoke step continue-on-error → không đỏ CI.
#
# Chỉ chạy trên PRODUCTION (tránh đốt Gemini + nhiễu trên mọi preview). Bật preview = bỏ guard 'roduction'.
on:
  deployment_status:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '20'

jobs:
  smoke:
    name: Smoke (read-only + planner liveness)
    if: >-
      github.event.deployment_status.state == 'success'
      && github.event.deployment_status.environment_url != ''
      && contains(github.event.deployment_status.environment, 'roduction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke against deployed URL
        id: smoke
        continue-on-error: true # non-blocking: smoke fail chỉ báo động, KHÔNG làm run đỏ
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
        run: pnpm smoke:prod

      - name: Open/append alert issue on failure (dedup by label)
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.event.deployment_status.environment_url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create smoke-fail --color B60205 --description "Post-deploy smoke failure" 2>/dev/null || true
          BODY="Post-deploy smoke FAILED for ${URL}. Run log: ${RUN}"
          EXISTING=$(gh issue list --label smoke-fail --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh issue create --title "Post-deploy smoke failed" --label smoke-fail --body "${BODY}"
          fi
