name: Post-deploy Smoke (alert-only)

# ALERT-ONLY, KHÔNG chặn promote. Vercel (git-integration) đẩy `deployment_status` khi deploy xong;
# workflow này chạy smoke:prod trên đúng URL Vercel cấp và MỞ/CẬP NHẬT 1 GitHub issue nếu hỏng.
# Không nằm trong required checks của master (workflow riêng) + smoke step continue-on-error → không đỏ CI.
#
# Chỉ chạy trên PRODUCTION (tránh đốt Gemini + nhiễu trên mọi preview). Bật preview = bỏ guard 'roduction'.
on:
  deployment_status:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '20'

jobs:
  smoke:
    name: Smoke (read-only + planner liveness)
    if: >-
      github.event.deployment_status.state == 'success'
      && github.event.deployment_status.environment_url != ''
      && contains(github.event.deployment_status.environment, 'roduction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke against deployed URL
        id: smoke
        continue-on-error: true # non-blocking: smoke fail chỉ báo động, KHÔNG làm run đỏ
        env:
          # #823/#684: KHÔNG dùng environment_url (URL per-build *.vercel.app) — nó bị Deployment
          # Protection (SSO) chặn (302→vercel.com/sso-api), smoke exit 2 BLOCKED → mở smoke-fail issue
          # trên MỌI prod deploy (false-alarm tái diễn: #785, #823). Thay bằng domain public canonical
          # (lenxevn.com) — prod deploy success đã được Vercel alias sang đó, smoke tới được app THẬT
          # (PASS/FAIL thực + planner-liveness). Override bằng repo var SMOKE_PROD_URL nếu cần.
          BASE_URL: ${{ vars.SMOKE_PROD_URL || 'https://lenxevn.com' }}
          # Vẫn forward Protection Bypass nếu owner set secret (vô hại trên domain public; cần nếu ai đó
          # trỏ SMOKE_PROD_URL về một URL protected). smoke:prod vẫn báo BLOCKED rõ nếu gặp SSO wall.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm smoke:prod

      - name: Open/append alert issue on failure (dedup by label)
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          # Report the URL actually smoked (same as the smoke step's BASE_URL), not the per-build
          # environment_url — so a real alert names the host that failed.
          URL: ${{ vars.SMOKE_PROD_URL || 'https://lenxevn.com' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create smoke-fail --color B60205 --description "Post-deploy smoke failure" 2>/dev/null || true
          BODY="Post-deploy smoke FAILED for ${URL}. Run log: ${RUN}"
          EXISTING=$(gh issue list --label smoke-fail --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh issue create --title "Post-deploy smoke failed" --label smoke-fail --body "${BODY}"
          fi
