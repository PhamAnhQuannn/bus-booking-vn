title = "Bus Booking VN - Gitleaks Config"

[extend]
useDefault = true

[[rules]]
id = "vn-mobile-number"
description = "Vietnamese mobile phone number"
regex = '''\+84[35789]\d{8}'''
tags = ["phone", "PII", "VN"]

[allowlist]
description = "Placeholder/fake VN phone numbers in seeds, tests, QA smoke artifacts, the redact util, and the shared doc-example literal — not real PII. Real app/lib source is still scanned."
regexes = [
  # Canonical fake doc-example number reused in docstrings (redactPhone, attachGuestBookingByPhone, …).
  '''\+84901234567''',
  # Fabricated SEED operator phone — used verbatim by prisma/seed.ts, the operator/auth tests,
  # the e2e specs, and the smoke crawl scripts (they log in with it, so it can't be x-masked).
  # Already path-allowlisted in those locations; allowlisting the literal also covers the commit
  # HISTORY that gitleaks-action scans (the value was introduced before its HEAD x-mask).
  '''\+84901230001''',
  # Fabricated numbers quoted inside QA reports that DISCUSS placeholder detection. Both are
  # unmistakably synthetic by shape — a repeating run and a descending run — and both must stay
  # readable, because a report explaining "+84909999999 was replaced by +8490xxxxxx9" is unusable
  # if the example it names is itself masked. Allowlisted as LITERALS, not by path: every OTHER
  # number under docs/qa/ is now scanned. See the paths block below for why that changed.
  '''\+84909999999''',
  '''\+84987654321''',
  # Elided JWT in a QA transcript showing a login response SHAPE. `eyJhbGciOiJIUzI1NiJ9` is
  # base64 of the literal header `{"alg":"HS256"}` — identical in every HS256 token ever issued —
  # and it is truncated at `...`, so there is no payload and no signature. Surfaced once the
  # docs/qa path exemption was removed; allowlisted as a value, which is the point of that change.
  '''eyJhbGciOiJIUzI1NiJ9\.\.\.''',
  # MoMo PUBLIC sandbox/test credentials — published in MoMo's official integration docs and
  # used by every integrator (the go-live guide labels them "(test)" and warns against real keys).
  # generic-api-key flags the access/secret key shapes in docs/momo-go-live.md; these are not secrets.
  '''MOMOBKUN20180529''',
  '''klm05TvNBzhg7h7j''',
  '''at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa''',
  # CI-only test secrets — clearly labeled "not-for-production" in .github/workflows/ci.yml.
  # generic-api-key flags them because the env var names contain SECRET/KEY.
  '''ci-test-jwt-secret-not-for-production-use-0123456789ab''',
  '''ci-test-operator-secret-not-for-production-0123''',
  '''ci-test-admin-secret-not-for-production-01234567''',
  '''ci-test-cron-secret-00''',
  # CI-only TOTP encryption key — deterministic hex pattern, not a real key.
  '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
  # VNPay PUBLIC sandbox defaults — sentinel values in lib/config/env.ts used to reject
  # the test credentials in production mode. Published in VNPay's integration docs.
  '''VNPAYSECRETTEST0123456789ABCDEF01''',
  '''VNPAYTEST''',
]
paths = [
  '''prisma/seed\.ts''',
  '''lib/audit/redactPhone\.ts''',
  '''.*__tests__.*''',
  '''.*\.test\.ts$''',
  '''e2e/.*''',
  # Smoke crawl scripts log in with the seed phone verbatim (cannot be x-masked).
  '''scripts/smoke/.*''',
  #
  # `docs/qa/.*` USED TO BE HERE AND WAS REMOVED ON 2026-08-01. Why it must not come back:
  #
  # A gitleaks `paths` entry disables EVERY rule for the matched tree, including this file's own
  # `vn-mobile-number`. It was added so QA reports could quote the fabricated seed phone — but
  # that number is allowlisted as a LITERAL above (`\+84901230001`), which is global, so the path
  # entry bought nothing its stated purpose needed. What it did buy was silence: tourism QA
  # reports began quoting live business phones and street addresses read off the `tourism-kb/raw/`
  # corpus — the exact PII class the ignore rules exist to keep out — and the scanner stayed green
  # the whole time because of this line.
  #
  # It was not hypothetical. `docs/qa/code-review-pr124-20260622.md:81` carried a real-looking
  # +84 mobile from 2026-06-25 to 2026-08-01 in a repo that is toggled PUBLIC during `/ship`. PR
  # #124 had masked that number at its source; the report DOCUMENTING the redaction re-published
  # it, and this allowlist is the only reason no gate ever said so.
  #
  # Rule: allowlist a fabricated VALUE, never a whole directory. A directory exemption is a
  # standing promise about every file anyone will ever add to it.
  # .env.example contains only placeholder values ("replace-with-32-byte-hex"),
  # never real secrets. generic-api-key flags SECRET= and KEY= var names.
  '''\.env\.example''',
]
